<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://tsover.swmansion.com" />
    <title>tsover</title>
    <script>
      var base = '/tsover';
      var path = window.location.pathname;
      var rest = path.startsWith(base) ? path.slice(base.length) : path;
      var target = 'https://tsover.swmansion.com' + rest + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
    <meta http-equiv="refresh" content="0; url=https://tsover.swmansion.com" />
  </head>
  <body>
    <a href="https://tsover.swmansion.com">Redirecting to tsover.swmansion.com…</a>
  </body>
</html>
